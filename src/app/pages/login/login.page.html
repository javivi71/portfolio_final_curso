<ion-header><ion-toolbar color="primary"><ion-title>Login</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header><ion-card-title>Acceso al Panel</ion-card-title></ion-card-header>
    <ion-card-content>
      <ion-item><ion-label position="floating">Email</ion-label><ion-input [(ngModel)]="email"></ion-input></ion-item>
      <ion-item><ion-label position="floating">Contraseña</ion-label><ion-input [(ngModel)]="password" type="password"></ion-input></ion-item>
      <ion-button expand="block" (click)="login()">Iniciar Sesión</ion-button>
      <ion-button expand="block" fill="clear" (click)="registro()">Registrarme</ion-button>
      <p style="font-size: 12px;">*Tras registrarte, cambia el rol a 'admin' en la tabla 'usuarios' de Supabase</p>
    </ion-card-content>
  </ion-card>
</ion-content>
