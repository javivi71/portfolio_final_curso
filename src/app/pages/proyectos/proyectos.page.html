<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Mi Portfolio</ion-title>
    <ion-buttons slot="end">
      <ion-button *ngIf="supabase.usuarioLogueado" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <div *ngIf="supabase.usuarioLogueado" class="ion-text-center header-info">
    <p>Bienvenido, <strong>{{ supabase.usuarioLogueado.email }}</strong></p>
    <p *ngIf="supabase.esAdmin" class="admin-badge">🔑 Administrador</p>
    <p *ngIf="!supabase.esAdmin" class="user-badge">👤 Usuario (Solo lectura)</p>
  </div>

  <div *ngIf="supabase.esAdmin" class="action-container">
    <ion-button expand="block" color="tertiary" (click)="abrirModal()" class="ion-margin-bottom btn-add">
      <ion-icon name="add-circle"></ion-icon> Añadir Proyecto
    </ion-button>
  </div>

  <div class="project-list">
    <ion-card *ngFor="let p of supabase.proyectos" class="project-card">
      <img [src]="p.imagen_url || 'assets/icon/favicon.png'" class="project-img" />
      <ion-card-header>
        <ion-card-title>{{ p.titulo }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ p.descripcion }}</p>
        <div *ngIf="supabase.esAdmin" class="action-buttons">
          <ion-button fill="clear" color="primary" (click)="abrirModal(p)">
            <ion-icon name="create-outline"></ion-icon>
          </ion-button>
          <ion-button fill="clear" color="danger" (click)="borrar(p.id)">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
